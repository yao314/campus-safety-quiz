const BANKS=[{"key":"general","name":"通识类安全题","count":383,"examCount":20,"sourceId":1471},{"key":"fire","name":"消防安全题","count":77,"examCount":5,"sourceId":4200},{"key":"electric","name":"电气类安全题","count":91,"examCount":5,"sourceId":1485},{"key":"college","name":"人工智能学院自制题库","count":246,"examCount":70,"sourceId":"18264/18263"}];
const QUESTIONS=[{"id":"1","category":"general","type":"J","prompt":"烘箱（干燥箱）在加热时，门可以开启。","options":["对","错"],"answer":"错"},{"id":"2","category":"general","type":"J","prompt":"电源插座、接线板、电线的容量应满足电器功率的需要。","options":["对","错"],"answer":"对"},{"id":"3","category":"general","type":"J","prompt":"为避免线路负荷过大，而引起火灾，功率1000瓦以上的设备不得共用一个接线板。","options":["对","错"],"answer":"对"},{"id":"4","category":"general","type":"J","prompt":"对于触电事故，应立即切断电源或用有绝缘性能的木棍棒挑开和隔绝电流，如果触电者的衣服干燥，又没有紧缠住身上，可以用一只手抓住他的衣服，拉离带电体；但救护人不得接触触电者的皮肤，也不能抓他的鞋。","options":["对","错"],"answer":"对"},{"id":"5","category":"general","type":"J","prompt":"实验室内应使用空气开关并配备必要的漏电保护器；电气设备应配备足够的用电功率和电线，不得超负荷用电；电气设备和大型仪器须接地良好，对电线老化等隐患要定期检查并及时排除。","options":["对","错"],"answer":"对"},{"id":"6","category":"general","type":"J","prompt":"大型仪器使用中，应注意仪器设备的接地、电磁辐射、网络等安全事项，避免事故发生。","options":["对","错"],"answer":"对"},{"id":"7","category":"general","type":"J","prompt":"实验室内的电线、开关、灯头、插头、插座等一切电器用具，要经常检查是否完好，有无漏电、潮湿、霉烂等情况。一旦有问题应立即报修。","options":["对","错"],"answer":"对"},{"id":"8","category":"general","type":"J","prompt":"可以用潮湿的手碰开关、电线和电器。","options":["对","错"],"answer":"错"},{"id":"9","category":"general","type":"J","prompt":"当手、脚或身体沾湿或站在潮湿的地板上时，切勿启动电源开关和触摸电气用具。","options":["对","错"],"answer":"对"},{"id":"10","category":"general","type":"J","prompt":"在实验室同时使用多种电气设备时，其总用电量和分线用电量均应小于设计容量。","options":["对","错"],"answer":"对"},{"id":"11","category":"general","type":"J","prompt":"不使用绝缘损坏或接地不良的电气设备。","options":["对","错"],"answer":"对"},{"id":"12","category":"general","type":"J","prompt":"负载处于工作状态时，可以插、拔、接电气线路。","options":["对","错"],"answer":"错"},{"id":"13","category":"general","type":"J","prompt":"接线时，要用合格的电源线，电源插头、插座。电源线接头要用绝缘胶布包好。","options":["对","错"],"answer":"对"},{"id":"14","category":"general","type":"J","prompt":"可以用湿布擦电源开关。","options":["对","错"],"answer":"错"},{"id":"15","category":"general","type":"J","prompt":"进行电气维修必须先关掉电源,在设置告知牌后，方可进行。","options":["对","错"],"answer":"对"},{"id":"16","category":"general","type":"J","prompt":"实验室的电源总闸没有必要每天离开时都关闭，只要关闭常用电气的电源即可。","options":["对","错"],"answer":"错"},{"id":"17","category":"general","type":"J","prompt":"电源插座附近不应堆放易燃物等杂物。","options":["对","错"],"answer":"对"},{"id":"18","category":"general","type":"J","prompt":"移动某些非固定安装的电气设备时(如电风扇，照明灯)，可以不必切断电源。","options":["对","错"],"answer":"错"},{"id":"19","category":"general","type":"J","prompt":"任何电气设备在未验明无电时，一律认为有电，不能盲目触及。","options":["对","错"],"answer":"对"},{"id":"20","category":"general","type":"J","prompt":"当断线落地或大电流从接地装置流入大地时，若人站在附近则可能在两脚之间产生跨步电压。","options":["对","错"],"answer":"对"},{"id":"21","category":"general","type":"J","prompt":"使用电气设备时可以用两眼插头代替三眼插头。","options":["对","错"],"answer":"错"},{"id":"22","category":"general","type":"J","prompt":"人体触电致死，是由于肝脏受到严重伤害。","options":["对","错"],"answer":"错"},{"id":"23","category":"general","type":"J","prompt":"一定强度的电场，磁场，电磁场都可能对人有损害。","options":["对","错"],"answer":"对"},{"id":"24","category":"general","type":"J","prompt":"在遇到高压电线断落地面时，导线断落点20米内，禁止人员进入。如果不慎在此范围内，应背朝电线断落点，采用单脚跳或双脚并跳，撤离现场。","options":["对","错"],"answer":"对"},{"id":"25","category":"general","type":"J","prompt":"计算机使用完毕后，应将显示器的电源关闭，以避免电源接通，产生瞬间的冲击电流。","options":["对","错"],"answer":"对"},{"id":"26","category":"general","type":"J","prompt":"触电事故是因电流流过人体而造成的。","options":["对","错"],"answer":"对"},{"id":"27","category":"general","type":"J","prompt":"为了预防电击（触电），电气设备的金属外壳须接地，最好是埋设接地电阻很小专用地线。","options":["对","错"],"answer":"对"},{"id":"28","category":"general","type":"J","prompt":"为保证安全用电，配电箱内所用的保险丝应该尽量粗。","options":["对","错"],"answer":"错"},{"id":"29","category":"general","type":"J","prompt":"在照明电路上可以不用安装漏电保护器。","options":["对","错"],"answer":"错"},{"id":"30","category":"general","type":"J","prompt":"化学类实验室原则上不得使用明火电炉。确须使用明火电炉进行实验的，须向实验室与设备处申报，经审核批准备案后，方可使用。","options":["对","错"],"answer":"对"},{"id":"31","category":"general","type":"J","prompt":"各院系要加强对剧毒、有害、特殊化学药品的管理，建立严格的领取、发放、登记和主管领导审批制度。","options":["对","错"],"answer":"对"},{"id":"32","category":"general","type":"J","prompt":"为方便进出专人管理的设备房间，可自行配制钥匙。","options":["对","错"],"answer":"错"},{"id":"33","category":"general","type":"J","prompt":"实验结束后，应该打扫卫生、整理或运走废弃的试样或物品。","options":["对","错"],"answer":"对"},{"id":"34","category":"general","type":"J","prompt":"国家秘密载体是指以文字、数据、符号、图形、图像、声音等方式记载国家秘密信息的纸介质、磁介质、光盘等各类物品。磁介质载体包括计算机硬盘、软盘和录音带、录像带等。","options":["对","错"],"answer":"对"},{"id":"35","category":"general","type":"J","prompt":"禁止邮寄属于国家秘密的文件、资料和其他物品出境，禁止非法携运属于国家秘密的文件、资料和其他物品出境。","options":["对","错"],"answer":"对"},{"id":"36","category":"general","type":"J","prompt":"实验室应保持整洁有序，不准喧哗、打闹、抽烟。","options":["对","错"],"answer":"对"},{"id":"37","category":"general","type":"J","prompt":"学生进入实验室学习、工作前应接受安全教育、培训，并通过考核。","options":["对","错"],"answer":"对"},{"id":"38","category":"general","type":"J","prompt":"进入化学、化工、生物、医学类实验室，可以不穿实验服。","options":["对","错"],"answer":"错"},{"id":"39","category":"general","type":"J","prompt":"可将食物储藏在实验室的冰箱或冷柜内。","options":["对","错"],"answer":"错"},{"id":"40","category":"general","type":"J","prompt":"实验结束后，要关闭设备，断开电源，并将有关实验用品整理好。","options":["对","错"],"answer":"对"},{"id":"41","category":"general","type":"J","prompt":"从事特种作业（如电工、焊工、辐射、病原微生物等）的人员，必须接受相关的专业培训，通过考核并持有相应的资质证书才能上岗。","options":["对","错"],"answer":"对"},{"id":"42","category":"general","type":"J","prompt":"节假日或假期在实验室做实验必须经导师批准，并报院系备案。","options":["对","错"],"answer":"对"},{"id":"43","category":"general","type":"J","prompt":"实验室内可以堆放个人物品。","options":["对","错"],"answer":"错"},{"id":"44","category":"general","type":"J","prompt":"实验室内可以使用电炉、微波炉、电磁炉、电饭煲等取暖、做饭。","options":["对","错"],"answer":"错"},{"id":"45","category":"general","type":"J","prompt":"实验室内禁止抽烟、进食。","options":["对","错"],"answer":"对"},{"id":"46","category":"general","type":"J","prompt":"可以在粉尘操作区饮食及吸烟。","options":["对","错"],"answer":"错"},{"id":"47","category":"general","type":"J","prompt":"发现被盗或人为破坏，应保护现场并立即报告保卫处。","options":["对","错"],"answer":"对"},{"id":"48","category":"general","type":"J","prompt":"实验室发生非火灾类事故，应立即报告单位负责人和学校保卫处，设立警戒区并撤离无关人员，以减轻潜在危害。","options":["对","错"],"answer":"对"},{"id":"49","category":"general","type":"J","prompt":"化学废液要回收并集中存放，不可倒入下水道。","options":["对","错"],"answer":"对"},{"id":"50","category":"general","type":"J","prompt":"学生进入实验室首先要了解实验室的安全注意事项。","options":["对","错"],"answer":"对"},{"id":"51","category":"general","type":"J","prompt":"未经允许不得随意拆卸实验仪器和设备。","options":["对","错"],"answer":"对"},{"id":"52","category":"general","type":"J","prompt":"实验进行前要了解实验仪器的使用说明及注意事项，实验过程中要严格按照操作规程进行操作。","options":["对","错"],"answer":"对"},{"id":"53","category":"general","type":"J","prompt":"实验仪器使用时要有人在场，不得擅自离开。","options":["对","错"],"answer":"对"},{"id":"54","category":"general","type":"J","prompt":"离开实验室前应检查门、窗、水龙头是否关好，通风设备、饮水设施、计算机、空调等是否已切断电源。","options":["对","错"],"answer":"对"},{"id":"55","category":"general","type":"J","prompt":"不能将实验室易燃易爆物品带出实验室。","options":["对","错"],"answer":"对"},{"id":"56","category":"general","type":"J","prompt":"有易燃易爆危险品的实验室禁止使用明火。","options":["对","错"],"answer":"对"},{"id":"57","category":"general","type":"J","prompt":"在不影响实验室周围的走廊通行的情况,可以堆放仪器等杂物。","options":["对","错"],"answer":"错"},{"id":"58","category":"general","type":"J","prompt":"只要不影响实验，可以在实验室洁净区域铺床睡觉。","options":["对","错"],"answer":"错"},{"id":"59","category":"general","type":"J","prompt":"实验室内不得停放自行车、电动车、汽车。","options":["对","错"],"answer":"对"},{"id":"60","category":"general","type":"J","prompt":"机械温控冰箱可以存放易燃易爆的化学品。","options":["对","错"],"answer":"错"},{"id":"61","category":"general","type":"J","prompt":"在使用高压灭菌锅、烤箱等高压加热设备时，必须有人值守。","options":["对","错"],"answer":"对"},{"id":"62","category":"general","type":"J","prompt":"为了防止盗窃事件的发生，临时离开实验室必须关门。","options":["对","错"],"answer":"对"},{"id":"63","category":"general","type":"J","prompt":"实验室气体钢瓶必须用铁链、钢瓶柜等固定，以防止倾倒引发安全事故。","options":["对","错"],"answer":"对"},{"id":"64","category":"general","type":"J","prompt":"因为实验需要，可以在实验室存放大量气体钢瓶。","options":["对","错"],"answer":"错"},{"id":"65","category":"general","type":"J","prompt":"实验废弃物应分类存放，及时送学校废弃物中转站，最后由学校联系有资质的公司进行处理。","options":["对","错"],"answer":"对"},{"id":"66","category":"general","type":"J","prompt":"实验室不得乱拉电线，套接接线板。","options":["对","错"],"answer":"对"},{"id":"67","category":"general","type":"J","prompt":"空调电源必须单独拉线，不得使用接线板。","options":["对","错"],"answer":"对"},{"id":"68","category":"general","type":"J","prompt":"实验室内可以使用木制配电板、闸刀开关、花线电线。","options":["对","错"],"answer":"错"},{"id":"69","category":"general","type":"J","prompt":"实验室应将相应的规章制度和操作规程挂到墙上或便于取阅的地方。","options":["对","错"],"answer":"对"},{"id":"70","category":"general","type":"J","prompt":"实验室门口应挂上写有安全责任人的姓名和联系方式的牌子。","options":["对","错"],"answer":"对"},{"id":"71","category":"general","type":"J","prompt":"不得在冰箱、烘箱等加热、产热设备附近放置纸板、化学试剂、气体钢瓶等物品。","options":["对","错"],"answer":"对"},{"id":"72","category":"general","type":"J","prompt":"遇到停电停水等情况，实验室人员必须检查电源和水源是否关闭，避免重新来电来水时发生相关安全事故。","options":["对","错"],"answer":"对"},{"id":"73","category":"general","type":"J","prompt":"废弃的放射源，必须报实验室与设备管理处，由实验室与设备管理处联系有资质的单位进行收贮，不得私自处理。","options":["对","错"],"answer":"对"},{"id":"74","category":"general","type":"J","prompt":"实验室人员必须定期检查设备、水电线路、门窗等是否完好，如发现问题，必须及时进行维修。","options":["对","错"],"answer":"对"},{"id":"75","category":"general","type":"J","prompt":"普通实验室内，不得私自饲养实验动物。","options":["对","错"],"answer":"对"},{"id":"76","category":"general","type":"J","prompt":"不得堵塞实验室逃生通道。","options":["对","错"],"answer":"对"},{"id":"77","category":"general","type":"J","prompt":"实验室钥匙的配发由实验室负责人管理，不得私自配置钥匙或借给他人使用。","options":["对","错"],"answer":"对"},{"id":"78","category":"general","type":"J","prompt":"实验室内电源根据需要可自行拆装、改线。","options":["对","错"],"answer":"错"},{"id":"79","category":"general","type":"J","prompt":"除非特殊需要并采取一定的安全保护措施，否则空调、计算机、饮水机等不得无人开机过夜。","options":["对","错"],"answer":"对"},{"id":"80","category":"general","type":"J","prompt":"不得带着实验防护手套开门、翻阅书籍、使用电脑。","options":["对","错"],"answer":"对"},{"id":"81","category":"general","type":"J","prompt":"仪器设备发生故障后，必须及时报告管理人员，并详细登记。","options":["对","错"],"answer":"对"},{"id":"82","category":"general","type":"J","prompt":"实验室冰箱内不得混放容易产生放热反应的化学品。","options":["对","错"],"answer":"对"},{"id":"83","category":"general","type":"J","prompt":"易燃、易爆气体和助燃气体（氧气等）的钢瓶不得混放在一起，并应远离热源和火源，保持通风。","options":["对","错"],"answer":"对"},{"id":"84","category":"general","type":"J","prompt":"上网信息的保密管理坚持“谁上网谁负责”的原则。","options":["对","错"],"answer":"对"},{"id":"85","category":"general","type":"J","prompt":"任何单位和个人不得在电子公告系统、聊天室、网络新闻组上发布、谈论和传播国家秘密信息。","options":["对","错"],"answer":"对"},{"id":"86","category":"general","type":"J","prompt":"与工作无关的外来人员不得进入实验室。","options":["对","错"],"answer":"对"},{"id":"87","category":"general","type":"J","prompt":"实验室内彼此保持安静，不得进行娱乐活动。","options":["对","错"],"answer":"对"},{"id":"88","category":"general","type":"J","prompt":"高校实验室科研教学活动中产生和排放的废气、废液、固体废物、噪声、放射性等污染物，应按环境保护行政主管部门的要求进行申报登记、收集、运输和处置。严禁把废气、废液、废渣和废弃化学品等污染物直接向外界排放。","options":["对","错"],"answer":"对"},{"id":"89","category":"general","type":"J","prompt":"烘箱、微波炉、电磁炉、饮水加热器、灭菌锅等高热能电器设备的放置地点应远离易燃、易爆物品。同时，规范操作，避免饮水加热器、灭菌锅等无水干烧。","options":["对","错"],"answer":"对"},{"id":"90","category":"general","type":"J","prompt":"建立健全安全管理规章制度，完善逐级安全责任制，贯彻执行“谁使用，谁管理”、“谁主管，谁负责”的安全工作原则。","options":["对","错"],"answer":"对"},{"id":"91","category":"general","type":"J","prompt":"应增强信息安全的意识，注意保护教学科研活动中实验技术参数、观测数据、实验分析结果及新的科学发现等资料。","options":["对","错"],"answer":"对"},{"id":"92","category":"general","type":"J","prompt":"要加强实验室排污处理装置（系统）的建设和管理，做到达标排放。实验废弃物不得倒入自来水下水道或普通垃圾箱等处。","options":["对","错"],"answer":"对"},{"id":"93","category":"general","type":"J","prompt":"实验室必须妥善保管消防器材和防盗装置，并定期检查。消防器材不得移作它用，周围禁止堆放杂物。","options":["对","错"],"answer":"对"},{"id":"94","category":"general","type":"J","prompt":"实验室安全与卫生检查内容主要包括实验室布置、卫生、水电安全、冰箱与烘箱使用管理、危险品使用与保管、化学与生物废弃物（气、液、固态物）的处置、排污管理、气体钢瓶安全、放射性安全等。","options":["对","错"],"answer":"对"},{"id":"95","category":"general","type":"J","prompt":"各学院每季度组织有关人员对实验室进行安全与卫生管理的例行检查，记录检查情况，提出存在的问题并限时整改。每次检查结束后须将检查结果形成报告，上报实验室处。","options":["对","错"],"answer":"对"},{"id":"96","category":"general","type":"J","prompt":"实验室如发现存在安全隐患，要及时向所在学院和实验室负责人、保卫处、实验室处报告，并采取措施进行整改。对安全隐患隐瞒不报或拖延上报的，学校将对相关责任人进行严肃处理。","options":["对","错"],"answer":"对"},{"id":"97","category":"general","type":"J","prompt":"可以将无毒无害试剂当作有毒有害试剂处理。","options":["对","错"],"answer":"错"},{"id":"98","category":"general","type":"J","prompt":"高压钢瓶可以没有固定设施，可以使用过期、未经检验和不合格的气瓶。","options":["对","错"],"answer":"错"},{"id":"99","category":"general","type":"J","prompt":"涉及生物安全性的动物实验，都必须在相应级别的生物安全实验室内进行。","options":["对","错"],"answer":"对"},{"id":"100","category":"general","type":"J","prompt":"一般的实验室只要干净、卫生情况良好，就可以饲养动物或进行动物实验。","options":["对","错"],"answer":"错"},{"id":"101","category":"general","type":"J","prompt":"实验动物是进行生命科学研究基本的材料和对象，它的质量关系到研究结果和成功率。因此，实验动物应该来源于具备资质的单位。","options":["对","错"],"answer":"对"},{"id":"102","category":"general","type":"J","prompt":"无论是否涉及病原微生物的实验动物尸体，都要进行无害化处理及冷冻保存，然后送具备相关资质的机构处理。","options":["对","错"],"answer":"对"},{"id":"104","category":"general","type":"J","prompt":"加强对实验动物管理工作，防止人畜共患病和动物传染病的发生，是搞好生物安全管理工作的根本目标。","options":["对","错"],"answer":"对"},{"id":"105","category":"general","type":"J","prompt":"废弃的利器(包括针头、小刀、金属和玻璃等)应直接弃置于耐扎容器内。","options":["对","错"],"answer":"对"},{"id":"106","category":"general","type":"J","prompt":"液体和固体实验废弃物不需分开放置。","options":["对","错"],"answer":"错"},{"id":"107","category":"general","type":"J","prompt":"一些低毒、无毒的实验废液可以不经处理，直接由下水道排放。","options":["对","错"],"answer":"错"},{"id":"108","category":"general","type":"J","prompt":"实验室地面出现溢水的主要原因之一是忘记关闭水龙头，尤其停水时忘关水龙头，因此离开实验室时要认真检查。","options":["对","错"],"answer":"对"},{"id":"109","category":"general","type":"J","prompt":"夏季天气热时可以在实验室内穿露有脚趾的鞋。","options":["对","错"],"answer":"错"},{"id":"110","category":"general","type":"J","prompt":"离开实验室时，实验服不得穿着外出，必须脱下并留在实验室内，更不能携带回家。","options":["对","错"],"answer":"对"},{"id":"111","category":"general","type":"J","prompt":"未经指导教师许可，不得搬弄仪器、设备，以及擅自开始实验。实验时，应注意安全，按要求操作，如发现异常立即停止。","options":["对","错"],"answer":"对"},{"id":"112","category":"general","type":"J","prompt":"在开放实验室，外来人员可随便操作实验室仪器设备。","options":["对","错"],"answer":"错"},{"id":"113","category":"general","type":"J","prompt":"实验室安全与卫生工作应坚持“安全第一，预防为主”的原则。","options":["对","错"],"answer":"对"},{"id":"114","category":"general","type":"J","prompt":"有关涉密的文件、资料的制作、保管建立病毒防护系统后可上网。","options":["对","错"],"answer":"错"},{"id":"115","category":"general","type":"J","prompt":"实验室的接线板远离可能有水的位置和高温环境。","options":["对","错"],"answer":"对"},{"id":"116","category":"general","type":"J","prompt":"红外灯、紫外灯不得安装在木柜或纸箱中使用。","options":["对","错"],"answer":"对"},{"id":"117","category":"general","type":"J","prompt":"电炉、烘箱等用电设备在使用中，使用人员不得离开。","options":["对","错"],"answer":"对"},{"id":"118","category":"general","type":"J","prompt":"剧毒品管理应严格遵守“五双” 制度(即\"双人保管、双人收发、双人使用、双人运输、双人双锁\")，精确计量和记录剧毒品的使用情况，防止被盗、丢失、误领、误用。如发现问题应立即报告保卫处、实验室与设备管理处和当地公安部门。","options":["对","错"],"answer":"对"},{"id":"119","category":"general","type":"J","prompt":"使用电子门禁的大楼和实验室，应对各类人员设置相应的级别，对于门禁卡丢失、人员调动或离校等情况应及时采取措施，办理报失或移交手续。","options":["对","错"],"answer":"对"},{"id":"120","category":"general","type":"J","prompt":"涉辐人员必须持有辐射安全与防护培训合格证书，并佩带个人剂量计进行实验。","options":["对","错"],"answer":"对"},{"id":"121","category":"general","type":"J","prompt":"电离辐射（放射性）的警告标识是:","options":["对","错"],"answer":"对","image":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAMCAgMCAgMDAwMEAwMEBQgFBQQEBQoHBwYIDAoMDAsKCwsNDhIQDQ4RDgsLEBYQERMUFRUVDA8XGBYUGBIUFRT/2wBDAQMEBAUEBQkFBQkUDQsNFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBT/wAARCAB4AH4DASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD9U6KKKACiiigAooooAK8ET9tD4et+0/L8D2vGTxGtuCl2SPs73WCxtM9pAmG9M5XrwdP9rv8AaN0z9mD4Ja14vu3jfVCv2TSLNzzc3jg7Bjuq4Lt7Kfav54Lvx3r1744l8YPqdwviV77+0v7RVyJRc794kB9Q3NAH9Q9FfPf7EH7U1j+1X8FbHXXeKLxVp22y12yTjy7kDiRR/ckA3L6fMv8ACa+gxQAtFFFA y":"general","type":"J","prompt":"碱灼伤时，必须先用大量流水冲洗至皂样物质消失，然后可用1%～2%醋酸或3%硼酸溶液进一步冲洗。","options":["对","错"],"answer":"对"},{"id":"139","category":"general","type":"J","prompt":"护送病人时，应取掉口中异物，采用平卧位，头部稍低，保持呼吸畅通。","options":["对","错"],"answer":"对"},{"id":"140","category":"general","type":"J","prompt":"发生意外后先对伤员进行必要的止血、包扎、固定等处理，然后尽可能用担架搬运，搬运时病人始终处脚朝前，头朝后，以便于随时观察伤者情况变化，及时实施急救处理。","options":["对","错"],"answer":"对"},{"id":"141","category":"general","type":"J","prompt":"急救时伤口包扎越紧越好。","options":["对","错"],"answer":"错"},{"id":"142","category":"general","type":"J","prompt":"急救时伤口包扎松劲适度，不可过紧或过松，以防滑脱或压迫神经和血管，影响远端血液循环，甚至造成肢体坏死。","options":["对","错"],"answer":"对"},{"id":"143","category":"general","type":"J","prompt":"某人因机械操作不慎，致使左手食指从指根完全离断，急救处理首先是找器皿保存断指，然后包扎残端伤口止血。","options":["对","错"],"answer":"错"},{"id":"144","category":"general","type":"J","prompt":"实施急救的顺序：若有呼吸心跳停止的，先行复苏，然后是止血、包扎、骨折固定或脱臼复位（固定）、搬运。","options":["对","错"],"answer":"对"},{"id":"145","category":"general","type":"J","prompt":"火或热水等引起的小面积烧伤、烫伤，必须用冷水冲洗30分钟以上，然后用烧伤膏涂抹，切不可用牙膏、酱油、盐等覆盖。","options":["对","错"],"answer":"对"},{"id":"146","category":"general","type":"J","prompt":"火或热水等引起的大面积烧伤、烫伤，必须用湿毛巾、湿布、湿棉被覆盖，然后送医院进行处理。","options":["对","错"],"answer":"对"},{"id":"147","category":"general","type":"J","prompt":"触电时，不可人去拉（可用木棒把伤员挑开），应立即切断电源，然后先做人工呼吸，再做心脏按压，同时报120送医院进行处理。","options":["对","错"],"answer":"对"},{"id":"148","category":"general","type":"J","prompt":"突发性不可抗拒的雷电、水灾、地震、房屋垮塌等自然灾害事故发生后，应在领导小组的指挥下，马上组织疏散、抢救现场工作人员或进行人员自助自救，以确保人员的人身安全，作好善后工作。","options":["对","错"],"answer":"对"},{"id":"149","category":"general","type":"J","prompt":"实验中遇到一般割伤，应立即取出伤口内的异物，保持伤口干净，并用酒精棉清除伤口周围的污物，涂上外伤膏或消炎粉。","options":["对","错"],"answer":"对"},{"id":"150","category":"general","type":"J","prompt":"实验中遇到严重割伤，可在伤口上部10cm处用沙布扎紧，减慢流血，并立即送医院。","options":["对","错"],"answer":"对"},{"id":"151","category":"general","type":"J","prompt":"实验中遇到一般烫伤和烧伤，不要弄破水泡，在伤口处用95%的酒精轻涂伤口，涂上烫伤膏或涂一层凡士林油，再用纱布包扎。","options":["对","错"],"answer":"对"},{"id":"152","category":"general","type":"J","prompt":"如溴滴落到皮肤上，应立即用水冲洗，再用1体积25%的氨水，1体积松节油和10体积（75%）酒精混合液涂敷；也可先用苯甘油除去溴，然后用水冲洗。","options":["对","错"],"answer":"对"},{"id":"153","category":"general","type":"J","prompt":"如酚灼伤皮肤，先用浸了甘油或聚乙二醇和酒精混合液（7：3）的棉花除去污物，再用清水冲洗干净，然后用饱和硫酸钠溶液湿敷。但不可用水直接冲洗污物，否则有可能使创伤加重。","options":["对","错"],"answer":"对"},{"id":"154","category":"general","type":"J","prompt":"实验中溅入口中而尚未下咽的毒物，应立即吐出，并用大量水冲洗口腔。","options":["对","错"],"answer":"对"},{"id":"155","category":"general","type":"J","prompt":"溅入口中已下咽的毒物，应根据毒物的性质服解毒剂，并立即送医院。","options":["对","错"],"answer":"对"},{"id":"156","category":"general","type":"J","prompt":"溅入口中已下咽的强酸，先饮用大量水，再服用氢氧化铝膏，鸡蛋清。","options":["对","错"],"answer":"对"},{"id":"157","category":"general","type":"J","prompt":"溅入口中已下咽的强碱，先饮用大量水，再服用乙酸果汁，鸡蛋清。","options":["对","错"],"answer":"对"},{"id":"158","category":"general","type":"J","prompt":"不论误食酸或碱，都可以灌注牛奶，不要吃呕吐剂。","options":["对","错"],"answer":"对"},{"id":"159","category":"general","type":"J","prompt":"如遇刺激性及神经性中毒，先服牛奶或鸡蛋白使之缓和，再服用硫酸铜溶液（30g溶于一杯水中）催吐。也可以用手指伸入喉部催吐后，立即送往医院。","options":["对","错"],"answer":"对"},{"id":"160","category":"general","type":"J","prompt":"如遇呼吸道吸进有毒气体、蒸气、烟雾而引起呼吸系统中毒时，应立即将病人移至室外空气新鲜的地方，解开衣领，使之温暖和安静，切勿随便进行人工呼吸。","options":["对","错"],"answer":"对"},{"id":"161","category":"general","type":"J","prompt":"因吸入少量氯气、溴蒸气而中毒，可用碳酸氢钠溶液漱口，不可进行人工呼吸。","options":["对","错"],"answer":"对"},{"id":"162","category":"general","type":"J","prompt":"实验室人员发生触电时，应迅速切断电源，将触电者上衣解开，取出口中异物，然后进性人工呼吸。当患者恢复呼吸时，应立即送医院。","options":["对","错"],"answer":"对"},{"id":"163","category":"general","type":"J","prompt":"当有人发生触电事故时，应马上直接将其拉开。","options":["对","错"],"answer":"错"},{"id":"164","category":"general","type":"J","prompt":"发现有人触电，应立即切断电源，不能直接拉触电者，应用木棒或其它绝缘物将人与带电体分离。","options":["对","错"],"answer":"对"},{"id":"165","category":"general","type":"J","prompt":"雷电发生时，如果作业人员孤立处于暴露区时，应该立即双手抱膝下蹲，向前弯曲。","options":["对","错"],"answer":"对"},{"id":"166","category":"general","type":"J","prompt":"在触电现场，若触电者已经没有呼吸或脉搏，此时可以判定触电者已经死亡，可以放弃抢救。","options":["对","错"],"answer":"错"},{"id":"167","category":"general","type":"J","prompt":"触电紧急救护时，首先应使触电者脱离电源，然后立即进行人工呼吸、心脏按压。","options":["对","错"],"answer":"对"},{"id":"168","category":"general","type":"J","prompt":"身边没有胶水胶棒时可以用口舔标签用以粘贴。","options":["对","错"],"answer":"错"},{"id":"169","category":"general","type":"J","prompt":"危险废弃物是指有潜在的生物危险、可燃易燃、腐蚀、有毒、放射性的对人环境有害的一切废弃物。","options":["对","错"],"answer":"对"},{"id":"170","category":"general","type":"J","prompt":"进行需要戴防护眼镜的实验时，戴隐形眼镜的近视者可不戴防护眼镜。","options":["对","错"],"answer":"错"},{"id":"171","category":"general","type":"J","prompt":"在清洁、维修仪器时，应先断电并确保无人能开启仪器。","options":["对","错"],"answer":"对"},{"id":"172","category":"general","type":"J","prompt":"安全事故处理应本着先人后物的原则，果断地、坚决地快速处置。","options":["对","错"],"answer":"对"},{"id":"173","category":"general","type":"J","prompt":"实验过程中如发生事故，应冷静妥善地处理，尽量把事故解决在萌芽状态。如较为严重，有危及人身安全可能时，应及时撤离现场，并通知邻近实验室工作人员迅速撤离，尽快报警。","options":["对","错"],"answer":"对"},{"id":"174","category":"general","type":"J","prompt":"做实验时要爱护实验设备，同时注意自身的安全，避免发生事故。","options":["对","错"],"answer":"对"},{"id":"175","category":"general","type":"J","prompt":"学生、新员工进实验室之前要参加安全教育和培训，经培训、考核合格后方可进入实验室学习与工作；学生要在老师指导下开展实验研究。","options":["对","错"],"answer":"对"},{"id":"176","category":"general","type":"J","prompt":"要保持实验室环境整洁，做到地面、桌面、设备三整洁，减少安全隐患。","options":["对","错"],"answer":"对"},{"id":"177","category":"general","type":"J","prompt":"实验室安全工作的中心任务是防止发生人员伤亡、财产和科研资料损失。","options":["对","错"],"answer":"对"},{"id":"178","category":"general","type":"J","prompt":"高校实验室发生安全事故的主要原因有：操作不慎、粗心大意、设施老化、缺少防护设施等。","options":["对","错"],"answer":"对"},{"id":"179","category":"general","type":"J","prompt":"实验室安全事故的表现形式主要有：火灾、爆炸、中毒、灼伤、病原微生物感染、辐照和机电伤人等。","options":["对","错"],"answer":"对"},{"id":"180","category":"general","type":"J","prompt":"因实验室特殊要求，细胞培养房内用的气体钢瓶可不用固定，只要平时小心就可以。","options":["对","错"],"answer":"错"},{"id":"181","category":"general","type":"J","prompt":"因实验室特殊要求，细胞培养房内用的气体钢瓶可用小推车等形式进行固定。","options":["对","错"],"answer":"对"},{"id":"183","category":"general","type":"J","prompt":"正在进行实验时，可带着防护手套接听电话。","options":["对","错"],"answer":"错"},{"id":"184","category":"general","type":"J","prompt":"发生各类案件时应立即报案，妥善保护案发现场，若有人受伤，在救人时应尽可能记住现场破坏前的情况（如手机拍照等）。","options":["对","错"],"answer":"对"},{"id":"185","category":"general","type":"J","prompt":"实验时,禁止用口吸方式移液。","options":["对","错"],"answer":"对"},{"id":"186","category":"general","type":"J","prompt":"针头、玻璃、一次性手术刀等利器应在使用后放在耐扎容器中，尖利物容器应在内容物达到三分之二前进行置换处置。","options":["对","错"],"answer":"对"},{"id":"187","category":"general","type":"J","prompt":"使用过的实验服脱下后，不得与日常衣服放在一起，也不得放在洁净区域。","options":["对","错"],"answer":"对"},{"id":"192","category":"general","type":"J","prompt":"在使用微波炉时，可以使用金属容器以及空载。","options":["对","错"],"answer":"错"},{"id":"193","category":"general","type":"J","prompt":"及时淘汰老化、性能不稳又具有安全隐患的仪器设备（如冰箱10年以上，烘箱12年以上）。","options":["对","错"],"answer":"对"},{"id":"194","category":"general","type":"J","prompt":"早晨、中饭、晚上等几个人员稀少的时间段，要特别注意随手关门，确保实验室财产和个人物品的安全。","options":["对","错"],"answer":"对"},{"id":"195","category":"general","type":"J","prompt":"教师应学习研究有关实验室安全的知识，同时在理论教学和实验中对学生进行安全知识教育、教会学生如何正确使用实验设备和实验操作，教会学生在突发事故发生时如何自我保护、相互救援、安全撤离。","options":["对","错"],"answer":"对"},{"id":"196","category":"general","type":"J","prompt":"在实验室发生事故时，现场人员应迅速组织、指挥，切断事故源，尽量阻止事态蔓延、保护现场；及时有序地疏散学生等人员，对现场已受伤人员作好自助自救、保护人身及财产。","options":["对","错"],"answer":"对"},{"id":"197","category":"general","type":"J","prompt":"接触化学危险品、剧毒以及致病微生物等的仪器设备和器皿，必须有明确醒目的标记。使用后及时清洁，特别是维修保养或移至到其他场地前，必须进行彻底的净化。","options":["对","错"],"answer":"对"},{"id":"198","category":"general","type":"J","prompt":"饮水加热器、灭菌锅等可以无水干烧。","options":["对","错"],"answer":"错"},{"id":"199","category":"general","type":"J","prompt":"有“严禁烟火”警示牌的大楼和实验室，可不必配置必要的消防、冲淋、洗眼、报警和逃生设施和有明显标志。","options":["对","错"],"answer":"错"},{"id":"200","category":"general","type":"J","prompt":"测试数据应进行异地备份。","options":["对","错"],"answer":"对"},{"id":"201","category":"general","type":"J","prompt":"使用U盘拷贝资料，应先对U盘杀毒，防止病毒感染 。","options":["对","错"],"answer":"对"},{"id":"202","category":"general","type":"J","prompt":"创造安全、卫生的实验室工作环境，仅仅是实验工作人员的责任。","options":["对","错"],"answer":"错"},{"id":"203","category":"general","type":"J","prompt":"加强计算机的安全管理，建立病毒防护系统并不断加以更新，重要的数据资料应定期进行备份。","options":["对","错"],"answer":"对"},{"id":"204","category":"general","type":"J","prompt":"使用激光扫描仪预览和扫描资料时，可以不盖上扫描仪盖子。","options":["对","错"],"answer":"错"},{"id":"207","category":"general","type":"J","prompt":"发生病原微生物被盗、被抢、丢失、泄漏，承运单位、护送人、保藏机构和实验室的设立单位未依照中华人民共和国卫生部《病原微生物实验室生物安全管理条例》的规定报告，造成传染病传播、流行或者其他严重后果的，由实验室的设立单位或者承运单位、保藏机构的上级主管部门对主要负责人、直接负责的主管人员和其他直接责任人员，依法给予撤职、开除的处分；构成犯罪的，依法追究刑事责任。","options":["对","错"],"answer":"对"},{"id":"209","category":"general","type":"J","prompt":"生物类实验室废弃物（包括动物残体等），可以丢弃在普通垃圾箱内。","options":["对","错"],"answer":"错"},{"id":"210","category":"general","type":"J","prompt":"生物实验中的一次性手套及沾染EB致癌物质的物品，可以丢弃在普通垃圾箱内。","options":["对","错"],"answer":"错"},{"id":"211","category":"general","type":"J","prompt":"为了确保动物实验的正常开展,应严格控制无关人员、昆虫及野生动物、病原微生物进入实验室。","options":["对","错"],"answer":"对"},{"id":"212","category":"general","type":"J","prompt":"生物废弃物应置于专用的、有标记的容器内。","options":["对","错"],"answer":"对"},{"id":"213","category":"general","type":"J","prompt":"有毒实验废弃物应明确专人负责，使用专用容器和醒目标识，将重金属、氰化物、溴化乙啶（EB）及其结合物进行分类收集，专人管理，定期回收，统一处理。","options":["对","错"],"answer":"对"},{"id":"214","category":"general","type":"J","prompt":"因运动量过度产生的酸疼，可以通过减量、休息、按摩、热敷等方法来帮助机体积极恢复。","options":["对","错"],"answer":"对"},{"id":"215","category":"general","type":"J","prompt":"从自己的实际情况出发，锻炼要循序渐进，不要急于求成，应做自己力所能及的动作。锻炼时间不宜过长，练习负荷不宜过重，以免过度疲劳或发生运动损伤。","options":["对","错"],"answer":"对"},{"id":"216","category":"general","type":"J","prompt":"运动锻炼时不能佩戴纪念章，不能携带小刀、钥匙、别针和其它尖利或硬质物体等物件，并要换上运动鞋、运动服等。","options":["对","错"],"answer":"对"},{"id":"217","category":"general","type":"J","prompt":"自然地形跑步时要注意做好缓冲动作，用全脚掌先着地，后蹬程度和前摆高度要小一些。","options":["对","错"],"answer":"错"},{"id":"218","category":"general","type":"J","prompt":"以下情况不宜进行游泳锻炼：患心脏病、高血压、肺结核和身体虚弱的人；严重沙眼、传染性皮肤病、细菌性肠炎等人；病刚好或发烧头疼、伤风感冒、过度疲劳、饥饿时；饭后45—60分钟和剧烈运动后不久；女生月经期不宜下水。","options":["对","错"],"answer":"对"},{"id":"219","category":"general","type":"J","prompt":"体育运动中的安全防范措施多种多样：进行器材锻炼时一定要有人保护；向前摔倒时顺势作前滚翻，不要用手撑地；向后摔倒时，让身体自然倒地，不要用手撑地，顺势作后滚翻。","options":["对","错"],"answer":"对"},{"id":"220","category":"general","type":"J","prompt":"户外运动遇到危险时，要保持冷静，对自己的处境有清醒的判断，然后选择适宜的求救方法，如将“SOS”写在旗帜、风筝、沙滩、沙漠、雪地或其他醒目的地方，另外还可利用喊声、口哨声、挥动衣服、手帕、旗帜、晃动镜子的反射光、点营火、敲打一切可以发出响声的物品方法求救。","options":["对","错"],"answer":"对"},{"id":"221","category":"general","type":"J","prompt":"人患感冒以后，可以通过激烈的体育锻炼使身体出汗，进而治病。","options":["对","错"],"answer":"错"},{"id":"222","category":"general","type":"J","prompt":"利用江河水域进行游泳锻炼时，要事先了解水域的水温，漩涡，水流，深水区、浅水区，水底水中情况等。","options":["对","错"],"answer":"对"},{"id":"223","category":"general","type":"J","prompt":"女生月经期间，可以参加适当的体育活动，如慢跑，打乒乓球、羽毛球、排球，舞蹈等运动负荷不大的活动。","options":["对","错"],"answer":"对"},{"id":"224","category":"general","type":"J","prompt":"出现肌肉痉挛（抽筋），常见的缓解法是拉长痉挛的肌肉，同时配合局部按摩和点压穴位等方法促进缓解。","options":["对","错"],"answer":"对"},{"id":"225","category":"general","type":"J","prompt":"出现内伤如挫伤、肌肉拉伤、关节扭伤、滑囊炎、腱鞘炎等24小时内一般用冷敷，加压包扎，抬高受伤的肢体等方法，尽可能减少受伤部位的出血。","options":["对","错"],"answer":"对"},{"id":"226","category":"general","type":"J","prompt":"血压升高，目光无神，情绪烦躁，面色苍白等，如果是因锻炼造成的，则都是运动不足的征兆。","options":["对","错"],"answer":"错"},{"id":"227","category":"general","type":"J","prompt":"剧烈运动后，不要立刻大量饮水、吃冷饮，也不要立即洗冷水澡。","options":["对","错"],"answer":"对"},{"id":"228","category":"general","type":"J","prompt":"肥胖产生的原因是由于进食过多，消耗过少，使摄入的热量超过了机体所消耗的热量，过多的热量在体内转变成脂肪并大量蓄积，造成脂肪组织异常增加所致。","options":["对","错"],"answer":"对"},{"id":"229","category":"general","type":"J","prompt":"体育锻炼的负荷量无论是强度、时间还是密度都要因人、因时而异，应根据自身的实际情况安排运动负荷。","options":["对","错"],"answer":"对"},{"id":"230","category":"general","type":"J","prompt":"脑震荡急救时，应让伤员平卧、安静，不可坐起或站立。头部可冷敷，身上保暖。若有昏迷现象者可掐人中、内关穴；如若呼吸发生障碍，可施行人工呼吸。","options":["对","错"],"answer":"对"},{"id":"231","category":"general","type":"J","prompt":"轻微的肌肉拉伤或少量的肌肉纤维的断裂，应立即冷敷，局部加压包扎，抬高肢体。","options":["对","错"],"answer":"对"},{"id":"232","category":"general","type":"J","prompt":"踝关节韧带扭伤以后立即冷敷，加压包扎固定。","options":["对","错"],"answer":"对"},{"id":"233","category":"general","type":"J","prompt":"对酸痛的肌肉冷敷有助于损伤组织的修复及痉挛的缓解。","options":["对","错"],"answer":"错"},{"id":"234","category":"general","type":"J","prompt":"实验室发生火警、火灾时，应立即采取措施灭火，并报保卫处或119。","options":["对","错"],"answer":"对"},{"id":"235","category":"general","type":"J","prompt":"发现实验室楼的配电箱起火，可以用楼内的消火栓放水灭火。","options":["对","错"],"answer":"错"},{"id":"236","category":"general","type":"J","prompt":"二氧化碳灭火器使用不当，可能会造成冻伤。","options":["对","错"],"answer":"对"},{"id":"237","category":"general","type":"J","prompt":"在附近无水源，身上着火来不及脱衣服时，应就地打滚，将火苗压灭进行自救。","options":["对","错"],"answer":"对"},{"id":"238","category":"general","type":"J","prompt":"消防队在扑救火灾时，有权根据灭火的需要，拆除或者破损临近火灾现场的建筑。","options":["对","错"],"answer":"对"},{"id":"239","category":"general","type":"J","prompt":"液体着火时，应用灭火器灭火，不能用水扑救或其它物品扑打。","options":["对","错"],"answer":"对"},{"id":"240","category":"general","type":"J","prompt":"建筑物发生火灾时，乘坐电梯疏散即快速又安全省力。","options":["对","错"],"answer":"错"},{"id":"241","category":"general","type":"J","prompt":"消防工作的方针是：“预防为主，防消结合”，实行消防安全责任制。","options":["对","错"],"answer":"对"},{"id":"242","category":"general","type":"J","prompt":"使用手提灭火器时，拨掉保险销，对准着火点根部用力压下压把，灭火剂喷出，就可灭火。","options":["对","错"],"answer":"对"},{"id":"243","category":"general","type":"J","prompt":"若被火场浓烟所困，应迅速起身跑出火场。","options":["对","错"],"answer":"错"},{"id":"244","category":"general","type":"J","prompt":"实验室应配备相应的消防器材。参加实验人员要熟悉其存放位置及使用方法并掌握有关的灭火知识。","options":["对","错"],"answer":"对"},{"id":"245","category":"general","type":"J","prompt":"实验室必须配备符合本室要求的消防器材，消防器材要放置在明显或便于拿取的位置。严禁任何人以任何借口把消防器材移作它用。","options":["对","错"],"answer":"对"},{"id":"246","category":"general","type":"J","prompt":"当发生火情时尽快沿着疏散指示标志和安全出口方向迅速离开火场。","options":["对","错"],"answer":"对"},{"id":"247","category":"general","type":"J","prompt":"大火封门无路可逃时，可用浸湿的被褥、衣物堵塞门缝，向门上泼水降温，以延缓火灾蔓延时间，呼叫待援。","options":["对","错"],"answer":"对"},{"id":"248","category":"general","type":"J","prompt":"爆炸是指物质瞬间突然发生物理或化学变化，同时释放出大量的气体和能量（光能、热能、机械能）并伴有巨大声响的现象。","options":["对","错"],"answer":"对"},{"id":"249","category":"general","type":"J","prompt":"实验室一旦发生起火，不要惊慌失措，应利用消防器材，采取有效措施控制、扑灭火灾。","options":["对","错"],"answer":"对"},{"id":"250","category":"general","type":"J","prompt":"火灾发生后，千万不要盲目跳楼，可利用疏散楼梯、阳台、窗口等逃生自救。也可用绳子或把床单、被套等撕成条状连成绳索，紧拴在窗框、铁栏杆等可靠的固定物上，用毛巾、布条等保护手心，顺绳滑下，或下到未着火的楼层进行逃生。","options":["对","错"],"answer":"对"},{"id":"251","category":"general","type":"J","prompt":"当可燃烧液体呈流淌状燃烧时，应将灭火剂的喷流对准火焰根部由近而远并左右扫射，向前快速推进，直至火焰扑灭。","options":["对","错"],"answer":"对"},{"id":"252","category":"general","type":"J","prompt":"如果可燃液体在容器内燃烧时，应从容器的一侧上部向容器中喷射但注意不能将喷流直接喷射在燃烧液面上，防止灭火剂的冲力将可燃液体冲出容器而扩大火势。","options":["对","错"],"answer":"对"},{"id":"253","category":"general","type":"J","prompt":"扑救气体火灾切忌盲目扑灭火势，首先应切断火势蔓延途径，然后疏散火势中压力容器或受到火焰辐射热威胁的压力容器，不能疏散的部署水枪进行冷却保护。","options":["对","错"],"answer":"对"},{"id":"254","category":"general","type":"J","prompt":"扑救毒害性、腐蚀性或燃烧产物毒害性较强的火灾时，必须配戴防护面具。","options":["对","错"],"answer":"对"},{"id":"255","category":"general","type":"J","prompt":"火灾发生后，穿过浓烟逃生时，必须尽量贴近地面，并用湿毛巾捂住口鼻。","options":["对","错"],"answer":"对"},{"id":"256","category":"general","type":"J","prompt":"火灾发生后，受到火势威胁时，要当机立断披上浸湿的衣物、被褥等向安全出口方向冲去。","options":["对","错"],"answer":"对"},{"id":"257","category":"general","type":"J","prompt":"火灾发生后，当所有的逃生线路被大火封锁时，应立即退回室内，用手电筒、挥舞衣物、呼叫等方式向窗外发送求救信号，等待救援。","options":["对","错"],"answer":"对"},{"id":"258","category":"general","type":"J","prompt":"隔离灭火法是将可燃物与引火源或氧气隔离开来，可防止火势继续扩大。","options":["对","错"],"answer":"对"},{"id":"259","category":"general","type":"J","prompt":"冷却灭火法是将可燃物冷却到其燃点以下，停止燃烧反应。","options":["对","错"],"answer":"对"},{"id":"260","category":"general","type":"J","prompt":"水具有导电性，不宜扑救带电设备的火灾，不能扑救遇水燃烧物质或非水溶性燃烧液体的火灾。","options":["对","错"],"answer":"对"},{"id":"261","category":"general","type":"J","prompt":"灭火器按其移动形式可分为：手提式和推车式。","options":["对","错"],"answer":"对"},{"id":"262","category":"general","type":"J","prompt":"电气设备发生火灾时，应注意：1、电气设备可能带电，可能发生触电事故；2、某些电气设备充有大量的油，可能发生喷油甚至爆炸。","options":["对","错"],"answer":"对"},{"id":"263","category":"general","type":"J","prompt":"在熟睡时，听到火警信号后正确的做法是：1、用手试一试门是否热，如是冷的，可开门逃生；2、准备好湿毛巾；3、切勿随意跳楼，自制救生绳索后再设法安全着落；4、利用自然条件作为救生滑道。","options":["对","错"],"answer":"对"},{"id":"264","category":"general","type":"J","prompt":"在室外灭火时，应站在上风位置。","options":["对","错"],"answer":"对"},{"id":"265","category":"general","type":"J","prompt":"灭火的四种方法是隔离法、窒息法、冷却法、化学抑制法。","options":["对","错"],"answer":"对"},{"id":"266","category":"general","type":"J","prompt":"单位消防安全制度主要包括以下内容：消防安全教育、培训；防火巡查、检查；安全疏散设施管理；消防（控制室）值班；消防设施、器材维护管理；火灾隐患整改；用火、用电安全管理；易燃易爆危险物品和场所防火防爆；专职和义务消防队的组织管理；灭火和应急疏散预案演练；燃气和电气的检查管理（包括防雷、防静电）；消防安全工作考评和奖惩；其他必要的消防安全内容。","options":["对","错"],"answer":"对"},{"id":"267","category":"general","type":"J","prompt":"仪器设备用电或线路发生故障着火时，应立即切断现场电源，将人员疏散，并组织人员用灭火器进行灭火。","options":["对","错"],"answer":"对"},{"id":"268","category":"general","type":"J","prompt":"火灾对实验室构成的威胁最为严重，最为直接。应加强对火灾三要素（易燃物、助燃物、点火源）的控制。","options":["对","错"],"answer":"对"},{"id":"269","category":"general","type":"J","prompt":"实验室常用的灭火方法：用水灭火、砂土灭火、灭火器。","options":["对","错"],"answer":"对"},{"id":"270","category":"general","type":"J","prompt":"实验大楼因出现火情发生浓烟时应迅速离开，当浓烟已穿入实验室内时，要沿地面匍匐前进，因地面层新鲜空气较多，不易中毒而窒息，有利于逃生。当逃到门口时，千万不要站立开门，以避免被大量浓烟熏倒。","options":["对","错"],"answer":"对"},{"id":"271","category":"general","type":"J","prompt":"实验室内出现火情逃到室外走廊时，要尽量做到随手关门，这样一来可阻挡火势随人运动而迅速蔓延，增加逃生的有效时间。","options":["对","错"],"answer":"对"},{"id":"272","category":"general","type":"J","prompt":"实验大楼出现火情时千万不要乘电梯，因为电梯可能因停电或失控，同时又因“烟囱效应”，电梯井常常成为浓烟的流通道。","options":["对","错"],"answer":"对"},{"id":"273","category":"general","type":"J","prompt":"实验室内出现火情，若被困在室内时，应迅速打开水龙头，将所有可盛水的容器装满水，并把毛巾打湿。用湿毛巾捂嘴，可以遮住部分浓烟不被吸入。","options":["对","错"],"answer":"对"},{"id":"274","category":"general","type":"J","prompt":"实验室灭火的方法要针对起因选用合适的方法。一般小火可用湿布、石棉布或沙子覆盖燃烧物即可灭火。","options":["对","错"],"answer":"对"},{"id":"275","category":"general","type":"J","prompt":"电气线路着火，要先切断电源，再用干粉灭火器或二氧化碳灭火器灭火，不可直接泼水灭火，以防触电或电气爆炸伤人。","options":["对","错"],"answer":"对"},{"id":"276","category":"general","type":"J","prompt":"电气设备着火时，可以用水扑灭。","options":["对","错"],"answer":"错"},{"id":"277","category":"general","type":"J","prompt":"被困在电梯中应尽快扒开门脱险。","options":["对","错"],"answer":"错"},{"id":"278","category":"general","type":"J","prompt":"燃烧必须具备可燃物、助燃物和点火源三大条件，缺一不可。因此，可以采取尽量隔离的方式来防止实验室火灾的发生。","options":["对","错"],"answer":"对"},{"id":"830","category":"general","type":"S","prompt":"引起电器线路火灾的原因是：","options":["短路","电火花","负荷过载","以上都是"],"answer":"D"},{"id":"831","category":"general","type":"S","prompt":"在遇到高压电线断落地面时，导线断落点多少米内，禁止人员进入。","options":["10","20","30","50"],"answer":"B"},{"id":"832","category":"general","type":"S","prompt":"进行照明设施的接电操作，应采取的防触电措施为：","options":["湿手操作","切断电源","站在金属登子或梯子上","戴上手套"],"answer":"B"},{"id":"833","category":"general","type":"S","prompt":"一般居民住宅、办公场所，若以防止触电为主要目的时，应选用漏电动作电流为多少的漏电保护开关？","options":["6 mA","15mA","30mA","50mA"],"answer":"C"},{"id":"834","category":"general","type":"S","prompt":"发生触电事故的危险电压一般是?多少伏以上？","options":["24","26","65","110"],"answer":"C"},{"id":"835","category":"general","type":"S","prompt":"万一发生电气火灾，首先应该采取的第一条措施是：","options":["打电话报警","切断电源","扑灭明火","求援"],"answer":"B"},{"id":"836","category":"general","type":"S","prompt":"实验室、宿舍禁止使用电热水壶、热得快。一般电热水壶的功率为：","options":["100W左右","200W左右","500W左右","800W以上"],"answer":"D"},{"id":"837","category":"general","type":"S","prompt":"造成触电事故的因素是：","options":["电流流过人体","电压","电场","磁场"],"answer":"A"},{"id":"838","category":"general","type":"S","prompt":"静电电压最高可达（），放电时易产生静电火花，引起火灾。","options":["50伏","上万伏","220伏","380伏"],"answer":"B"},{"id":"839","category":"general","type":"S","prompt":"金属梯子不适于以下什么工作场所?","options":["带电作业的工作场所","坑穴或密闭场所","高空作业","静电"],"answer":"A"},{"id":"840","category":"general","type":"S","prompt":"电线插座损坏时，既不美观也不方便工作，并造成：","options":["吸潮漏电","空气开关跳闸","触电伤害","以上都是"],"answer":"D"},{"id":"841","category":"general","type":"S","prompt":"国内民用照明电路电压为以下哪种?","options":["直流电压220伏","交流电压280伏","交流电压220伏","交流电压110伏"],"answer":"C"},{"id":"842","category":"general","type":"S","prompt":"人体在电磁场作用下会受到不同程度的伤害，其原因是？","options":["电流","电压","电磁波辐射","静电"],"answer":"C"},{"id":"843","category":"general","type":"S","prompt":"雷电放电具有什么特点？","opt wer":"对"},{"id":"753","category":"electric","type":"J","prompt":"电动工具的电源引线必须保证接地可靠。","options":["对","错"],"answer":"对"},{"id":"754","category":"electric","type":"J","prompt":"接电路元器件时，主要应关注元器件的耐压和能承受的功率。","options":["对","错"],"answer":"对"},{"id":"755","category":"electric","type":"J","prompt":"对容易产生静电的场所，要保持空气潮湿；工作人员要穿防静电的衣服和鞋靴。?","options":["对","错"],"answer":"对"},{"id":"757","category":"electric","type":"J","prompt":"电磁式电流互感器在使用中付边不许开路，电压互感器在使用中付边不许短路。","options":["对","错"],"answer":"对"},{"id":"758","category":"electric","type":"J","prompt":"实验室禁止私拉乱接电线，实验过程中自制非标设备时，应报请实验室管理人员批准，然后请电气专业人员按照标准安全的连接。","options":["对","错"],"answer":"对"},{"id":"759","category":"electric","type":"J","prompt":"只要接线板质量符合要求，就可以随意串联很多个，不影响使用。","options":["对","错"],"answer":"错"},{"id":"760","category":"electric","type":"J","prompt":"在充满可燃气体的环境中，可以使用手动电动工具。","options":["对","错"],"answer":"错"},{"id":"761","category":"electric","type":"J","prompt":"在易燃、易爆、易灼烧及有静电发生的场所，可以使用化纤防护用品。","options":["对","错"],"answer":"错"},{"id":"762","category":"electric","type":"J","prompt":"电动工具应定期检修。","options":["对","错"],"answer":"对"},{"id":"763","category":"electric","type":"J","prompt":"连接在接线板上的用电总负荷不能超过接线板的最大容量。","options":["对","错"],"answer":"对"},{"id":"764","category":"electric","type":"J","prompt":"在电气类开放性实验或科研实验室，必须二人以上方可开展实验。","options":["对","错"],"answer":"对"},{"id":"765","category":"electric","type":"J","prompt":"为了防止触电可采用绝缘、防护、隔离等技术措施以保障安全。","options":["对","错"],"answer":"对"},{"id":"766","category":"electric","type":"J","prompt":"漏电保护器对两相触电（人体双手触及两相电源），不起保护作用。","options":["对","错"],"answer":"对"},{"id":"767","category":"electric","type":"J","prompt":"漏电保护器既可用来保护人身安全，还可用来对低压系统或设备的绝缘状况起到监督作用；漏电保护器安装点以后的线路应是对地绝缘良好。","options":["对","错"],"answer":"对"},{"id":"768","category":"electric","type":"J","prompt":"消除管线上的静电主要是做好屏蔽。","options":["对","错"],"answer":"错"},{"id":"769","category":"electric","type":"J","prompt":"保险丝和空气开关可以有效地防止电气火灾。","options":["对","错"],"answer":"错"},{"id":"770","category":"electric","type":"J","prompt":"金属 ":"college","type":"S","prompt":"电气设备的外壳应有什么防护措施？","options":["无","保护性接地","防锈漆","绝缘"],"answer":"B"},{"id":"20292","category":"college","type":"S","prompt":"在进行电子线路板焊接后的剪脚工序时应（）","options":["戴上防护眼镜","戴上护耳器","戴上安全帽","戴上手套"],"answer":"A"},{"id":"20293","category":"college","type":"S","prompt":"强电实验时，实验人员必须几人以上？","options":["1","2","3","4"],"answer":"B"},{"id":"20294","category":"college","type":"S","prompt":"在需要带电操作的低电压电路实验时，下列哪种是正确的？","options":["双手操作比单手操作安全","单手操作比双手操作安全","单手操作和双手操作一样安全","操作与空气湿度有关"],"answer":"B"},{"id":"20295","category":"college","type":"S","prompt":"电分强电和弱电，下列说法正确的是（）","options":["强电和弱电开关等元件可通用","弱电开关等元件不可用在强电电路","开关不分强弱","弱电开关等元件可用在强电电路"],"answer":"B"},{"id":"20296","category":"college","type":"S","prompt":"因实验需要拉接电源线，下列哪种说法是正确的？","options":["不得任意放置于通道上，以免因绝缘破损早餐短路或影响通行","插座不足时，可连续串接","插座不足时，可连续分接","不考虑负荷容量"],"answer":"A"},{"id":"20298","category":"college","type":"S","prompt":"使用电烙铁应注意（）","options":["不能乱甩焊锡","及时放回烙铁架，用完及时切断电源","周围不得放置易燃物品","以上都是"],"answer":"D"},{"id":"20299","category":"college","type":"S","prompt":"电路实验中，下列哪种操作是错误的？","options":["电压源不能短路","电流源不能短路","电流源能短路","上述操作都是正确的"],"answer":"B"},{"id":"20300","category":"college","type":"S","prompt":"任何电气设备在未验明无电之前，一律认为（）","options":["无电","也许有电","有电","也许无电"],"answer":"C"},{"id":"20301","category":"college","type":"S","prompt":"以下有关实验室用电的注意事项中，不正确的是（）","options":["实验前先检查用电设备，再接通电源；实验结束后，先关仪器设备，再关闭电源","工作人员离开实验室或突然断电，应关闭电源，尤其要关闭加热电器的电源开关","电源或电器设备的保险丝烧断后，可以用其他金属导线代替","不得将供电线任意放在通道上，以免因绝缘破损造成短路"],"answer":"C"},{"id":"20302","category":"college","type":"S","prompt":"对于高压电容器，实验结束后或闲置时，如何处理最合适？","options":["电极接地","双电极短接（串接合适电阻进行放电）","双电极接地","不处理"],"answer":"B"},{"id":"20303","category":"college","type":"S","prompt":"使用电器设备时，由于维护不及时，当什么进入时可导致短路事故？","options":["导电粉尘或纤维","强光辐射","高温环境","潮气"],"answer":"A"},{"id":"20304","category":"college","type":"S","prompt":"设备或线路的确认无电，应以什么指示作为根据？","options":["电压表","正常的验电工具","断开信号","电流表"],"answer":"B"},{"id":"20305","category":"college","type":"S","prompt":"保证电气检修人员人身安全最有效的措施是（）","options":["悬挂标识牌","放置遮栏","将检修设备接地并短路","穿绝缘鞋"],"answer":"C"},{"id":"20306","category":"college","type":"S","prompt":"如果工作场所潮湿，为避免触电，使用手持电动工具的人应（）","options":["站在铁板上操作","站在绝缘胶板上操作","穿防静电鞋操作","站在木板上操作"],"answer":"B"},{"id":"20307","category":"college","type":"S","prompt":"触电事故中，绝大部分是由于（）导致人身伤亡的。","options":["人体接受电流遭到电击","烧伤","电休克","抽搐"],"answer":"A"},{"id":"20308","category":"college","type":"S","prompt":"实验仪器使用完后，如果需要拔出插头，正确的方式是（）","options":["直接以拉扯电线方式拔出","握住插头拔出","洗手后湿手拔出","不必拔出"],"answer":"B"},{"id":"20309","category":"college","type":"S","prompt":"安全使用台灯，以下不正确的是？","options":["灯泡功率不得超过60W","不能用纸做灯罩","远离可燃物","长时间持续点亮"],"answer":"D"}];
const letters='ABCDE';
let drawn=null;
let answersVisible=true;
const container=document.getElementById('content');
const search=document.getElementById('search');
const type=document.getElementById('type');
const count=document.getElementById('count');
const empty=document.getElementById('empty');
const sections=new Map();
const questionNodes=[];
function element(tag,className,text) { const e=document.createElement(tag); if(className)e.className=className; if(text!==undefined)e.textContent=text; return e; }
for(const bank of BANKS) {
  const section=element('section','category'); section.id=bank.key;
  const h=element('h2','',bank.name); const n=element('span','',bank.count+' 题'); h.append(n); section.append(h);
  container.append(section); sections.set(bank.key,{section,n});
}
for(const q of QUESTIONS) {
  const card=element('article','question'); card.dataset.id=q.category+'/'+q.id;
  const title=element('div','question-title');
  title.append(element('span','number','【'+q.id+'】'));
  title.append(element('span','prompt',q.prompt));
  title.append(element('span','question-type',q.type==='J'?'判断题':'选择题'));
  card.append(title);
  if(q.image) { const img=element('img','question-image'); img.src=q.image; img.alt='第'+q.id+'题原图'; img.loading='lazy'; card.append(img); }
  const opts=element('ul','options');
  q.options.forEach((option,i)=>{ const li=element('li'); li.append(element('span','letter',letters[i]+'.')); li.append(document.createTextNode(option)); opts.append(li); });
  card.append(opts);
  const correct=q.type==='J'?q.answer:q.answer+'. '+q.options[letters.indexOf(q.answer)];
  const answer=element('div','answer','✅ 正确答案：'+correct); answer.title='点击切换此题答案';
  answer.addEventListener('click',()=>answer.classList.toggle('is-hidden'));
  card.append(answer);
  sections.get(q.category).section.append(card);
  questionNodes.push({q,card,answer,text:(q.id+' '+q.prompt+' '+q.options.join(' ')+' '+q.answer).toLowerCase()});
}
function applyFilter(){
  const query=search.value.trim().toLowerCase(); const t=type.value; const shown={}; let total=0;
  for(const item of questionNodes){
    const yes=(!drawn||drawn.has(item.q.category+'/'+item.q.id))&&(t==='all'||item.q.type===t)&&(!query||item.text.includes(query));
    item.card.classList.toggle('hidden',!yes); if(yes){shown[item.q.category]=(shown[item.q.category]||0)+1;total++;}
  }
  for(const bank of BANKS){const s=sections.get(bank.key);s.section.classList.toggle('hidden',!shown[bank.key]);s.n.textContent=(shown[bank.key]||0)+' 题';}
  count.textContent=(drawn?'模拟练习 · ':'全部题库 · ')+'当前显示 '+total+' / '+(drawn?'100':'797')+' 题';
  empty.classList.toggle('hidden',total!==0);
}
function sample(arr,n){const copy=arr.slice();for(let i=0;i<n;i++){let j=i+Math.floor(Math.random()*(copy.length-i));[copy[i],copy[j]]=[copy[j],copy[i]];}return copy.slice(0,n);}
document.getElementById('draw').addEventListener('click',()=>{
  drawn=new Set(BANKS.flatMap(b=>sample(QUESTIONS.filter(q=>q.category===b.key),b.examCount)).map(q=>q.category+'/'+q.id));
  search.value='';type.value='all';document.getElementById('reset').classList.remove('hidden');
  answersVisible=false;for(const item of questionNodes)item.answer.classList.add('is-hidden');document.getElementById('answers').textContent='显示答案';
  applyFilter();window.scrollTo({top:0,behavior:'smooth'});
});
document.getElementById('reset').addEventListener('click',()=>{drawn=null;answersVisible=true;for(const item of questionNodes)item.answer.classList.remove('is-hidden');document.getElementById('answers').textContent='隐藏答案';document.getElementById('reset').classList.add('hidden');applyFilter();});
document.getElementById('answers').addEventListener('click',()=>{answersVisible=!answersVisible;for(const item of questionNodes)item.answer.classList.toggle('is-hidden',!answersVisible);document.getElementById('answers').textContent=answersVisible?'隐藏答案':'显示答案';});
search.addEventListener('input',applyFilter);type.addEventListener('change',applyFilter);
applyFilter();
</script>
</body>
</html>
